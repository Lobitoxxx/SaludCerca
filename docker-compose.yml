# ============================================================================
# SALUD CERCA - Infraestructura de datos (Data Lakehouse / OLAP)
# ----------------------------------------------------------------------------
# Levanta PostgreSQL 16 + PostGIS 3.4 + pgvector en un solo contenedor,
# con los scripts de esquema (Medallón Gold + Modelo Estrella) ejecutándose
# automáticamente en el primer arranque (directorio db/init).
#
#   Uso:
#     python data/generate_seed.py          # 1. Genera dataset sintético
#     docker compose up -d --build db       # 2. Levanta BD + esquema + seed
#     docker compose logs -f db             # 3. Verifica arranque
# ============================================================================

services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: saludcerca-db
    environment:
      POSTGRES_USER: saludcerca
      POSTGRES_PASSWORD: saludcerca123
      POSTGRES_DB: saludcerca
      # Zona horaria peruana (UTC-5)
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      # Datos persistentes de la instancia
      - pgdata:/var/lib/postgresql/data
      # Scripts de esquema ejecutados UNA VEZ en el primer arranque (orden alfabético)
      - ./db/init:/docker-entrypoint-initdb.d:ro
      # Datasets sintéticos generados por data/generate_seed.py (montados para seed)
      - ./data/output:/seed-data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saludcerca -d saludcerca"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # ============================================================================
  # API backend (Java 17 + Spring Boot): catálogo nacional, despacho y rutas.
  # El jar se compila con Maven local (backend/mvnw package) antes del build.
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saludcerca-api
    environment:
      POSTGRES_URL: jdbc:postgresql://db:5432/saludcerca
      VALHALLA_URL: http://valhalla:8002
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Motor de rutas (ADR-005): Valhalla self-hosted sobre grafo OSM Perú.
  # Los tiles se construyen UNA VEZ con scripts/valhalla-build.ps1 a partir de
  # data/osm/peru-latest.osm.pbf; este servicio solo sirve la API HTTP :8002.
  # ============================================================================
  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: saludcerca-valhalla
    command: ["valhalla_service", "/data/valhalla/config.json", "2"]
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla_data:/data/valhalla
    restart: unless-stopped

volumes:
  pgdata:
